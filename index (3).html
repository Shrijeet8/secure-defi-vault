<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure DeFi Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<style>
/* ── Design tokens ─────────────────────────────────────── */
:root {
  --bg:         #06080d;
  --surface:    #0c1018;
  --surface2:   #111820;
  --surface3:   #17202b;
  --border:     #1c2a38;
  --border-hi:  #243547;
  --accent:     #00d4ff;
  --accent-dim: rgba(0,212,255,.14);
  --accent-lo:  rgba(0,212,255,.06);
  --green:      #2efc9a;
  --green-dim:  rgba(46,252,154,.13);
  --amber:      #ffb340;
  --amber-dim:  rgba(255,179,64,.13);
  --red:        #ff4d6d;
  --red-dim:    rgba(255,77,109,.13);
  --text:       #dce8f5;
  --text-2:     #7a9ab8;
  --text-3:     #3d5872;
  --mono:       'Share Tech Mono', monospace;
  --sans:       'Syne', sans-serif;
  --r:          14px;
  --r-sm:       8px;
}

/* ── Reset ─────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button{-webkit-appearance:none}

/* ── Background ────────────────────────────────────────── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:52px 52px;
  opacity:.28;
  mask-image:radial-gradient(ellipse 90% 90% at 50% 40%,#000 20%,transparent 80%);
}
.bg-radial{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 40% at 50% -5%, rgba(0,212,255,.09) 0%,transparent 70%),
    radial-gradient(ellipse 30% 25% at 80% 90%, rgba(46,252,154,.05) 0%,transparent 60%);
}

/* ── Wrapper ───────────────────────────────────────────── */
.wrap{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  padding:28px 18px 36px;
  display:flex;flex-direction:column;gap:18px;
  animation:rise .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ── Header ────────────────────────────────────────────── */
header{display:flex;align-items:center;justify-content:space-between}

.logo{display:flex;align-items:center;gap:9px}
.logo-icon{
  width:30px;height:30px;
  filter:drop-shadow(0 0 8px var(--accent));
  animation:shield-pulse 3s ease-in-out infinite;
}
@keyframes shield-pulse{
  0%,100%{filter:drop-shadow(0 0 6px var(--accent))}
  50%{filter:drop-shadow(0 0 14px var(--accent))}
}
.logo-text{font-weight:800;font-size:.95rem;letter-spacing:.04em}
.logo-text span{color:var(--accent)}

.badge{
  display:flex;align-items:center;gap:6px;
  background:var(--accent-lo);
  border:1px solid rgba(0,212,255,.2);
  border-radius:100px;padding:4px 11px;
}
.badge-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 7px var(--green);
  animation:blink 2.2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.badge-label{font-family:var(--mono);font-size:.68rem;color:var(--accent);letter-spacing:.06em}

/* ── Card ──────────────────────────────────────────────── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  box-shadow:0 28px 72px rgba(0,0,0,.65),0 0 0 1px rgba(0,212,255,.04);
  overflow:hidden;
  transition:box-shadow .35s;
}
.card:hover{box-shadow:0 28px 72px rgba(0,0,0,.65),0 0 40px rgba(0,212,255,.12)}
.card-bar{
  height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--green) 60%,transparent 100%);
}
.card-inner{padding:26px 26px 22px;display:flex;flex-direction:column;gap:0}

/* ── Micro label ───────────────────────────────────────── */
.mlabel{
  font-family:var(--mono);font-size:.65rem;
  letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:11px;
}

/* ── Section separator ─────────────────────────────────── */
.sep{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:20px -26px;
}

/* ── Wallet section ────────────────────────────────────── */
.wallet-box{display:flex;flex-direction:column}

.wallet-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:10px 13px;
  margin-bottom:13px;
  animation:fade-in .3s ease;
}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wallet-hex{color:var(--accent);font-size:.95rem;line-height:1}
.wallet-addr{
  font-family:var(--mono);font-size:.78rem;
  color:#8bacc8;flex:1;letter-spacing:.04em;word-break:break-all;
}
.copy-btn{
  background:none;border:none;cursor:pointer;
  color:var(--text-3);padding:3px;border-radius:4px;
  line-height:0;transition:color .2s;
}
.copy-btn:hover{color:var(--green)}

/* Connect button */
.btn-connect{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:13px;border:none;border-radius:var(--r-sm);
  background:linear-gradient(130deg,var(--accent) 0%,#009ec0 100%);
  color:#020a10;font-family:var(--sans);font-weight:800;
  font-size:.92rem;letter-spacing:.04em;cursor:pointer;
  box-shadow:0 0 24px rgba(0,212,255,.28);
  transition:all .22s ease;position:relative;overflow:hidden;
}
.btn-connect::after{
  content:'';position:absolute;inset:0;
  background:#fff;opacity:0;transition:opacity .18s;
}
.btn-connect:hover{transform:translateY(-1px);box-shadow:0 0 36px rgba(0,212,255,.45)}
.btn-connect:hover::after{opacity:.07}
.btn-connect:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn-arrow{transition:transform .2s}
.btn-connect:hover .btn-arrow{transform:translateX(4px)}

/* ── Balance row ───────────────────────────────────────── */
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.bal-tile{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:13px 15px;
  transition:border-color .25s;
}
.bal-tile:hover{border-color:var(--border-hi)}
.bal-title{
  font-family:var(--mono);font-size:.62rem;
  color:var(--text-3);letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:7px;
}
.bal-row{display:flex;align-items:baseline;gap:5px}
.bal-num{
  font-family:var(--mono);font-size:1.45rem;
  color:var(--accent);
  text-shadow:0 0 18px rgba(0,212,255,.4);
  transition:all .3s;
}
.bal-num.green{
  color:var(--green);
  text-shadow:0 0 18px rgba(46,252,154,.35);
}
.bal-unit{font-family:var(--mono);font-size:.67rem;color:var(--text-3);letter-spacing:.1em}

.refresh-btn{
  display:inline-flex;align-items:center;gap:5px;
  margin-top:9px;background:none;border:none;
  color:var(--text-3);font-family:var(--mono);
  font-size:.68rem;cursor:pointer;letter-spacing:.06em;
  padding:3px 0;transition:color .2s;
}
.refresh-btn:hover{color:var(--accent)}
.refresh-btn svg{transition:transform .45s ease}
.refresh-btn:hover svg{transform:rotate(180deg)}

/* ── Amount input ──────────────────────────────────────── */
.input-wrap{position:relative;display:flex;align-items:center;margin-bottom:16px}
.amount-input{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:13px 56px 13px 15px;
  font-family:var(--mono);font-size:1.08rem;
  color:var(--text);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.amount-input::placeholder{color:var(--text-3)}
.amount-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.amount-input:disabled{opacity:.4;cursor:not-allowed}
.input-unit{
  position:absolute;right:14px;
  font-family:var(--mono);font-size:.7rem;
  color:var(--text-3);letter-spacing:.1em;pointer-events:none;
}

/* ── Action buttons ────────────────────────────────────── */
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:var(--r-sm);
  font-family:var(--sans);font-weight:700;font-size:.86rem;
  letter-spacing:.03em;cursor:pointer;
  padding:12px 16px;
  position:relative;overflow:hidden;
  transition:all .22s ease;
}
.btn::after{
  content:'';position:absolute;inset:0;
  background:#fff;opacity:0;transition:opacity .18s;
}
.btn:hover::after{opacity:.07}
.btn:active::after{opacity:.13}
.btn:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

/* Deposit — full width, state-aware */
.btn-deposit{
  background:linear-gradient(130deg,var(--accent) 0%,#009ec0 100%);
  color:#020a10;
  box-shadow:0 0 18px rgba(0,212,255,.22);
  grid-column:1/-1; /* spans full row */
  padding:14px;font-size:.92rem;
}
.btn-deposit:hover{
  transform:translateY(-1px);
  box-shadow:0 0 32px rgba(0,212,255,.42);
}

/* Withdraw */
.btn-withdraw{
  background:var(--green-dim);
  border:1px solid var(--green);
  color:var(--green);
  grid-column:1/-1;
}
.btn-withdraw:hover{
  background:var(--green);color:#040f0a;
  transform:translateY(-1px);
  box-shadow:0 0 20px rgba(46,252,154,.35);
}

/* ── Deposit button states ─────────────────────────────── */
/* Phase 1: needs approve */
.btn-deposit[data-phase="approve"]{
  background:linear-gradient(130deg,var(--amber) 0%,#c07800 100%);
  box-shadow:0 0 18px rgba(255,179,64,.22);
  color:#100800;
}
.btn-deposit[data-phase="approve"]:hover{
  box-shadow:0 0 32px rgba(255,179,64,.45);
}
/* Phase 2: ready to deposit */
.btn-deposit[data-phase="deposit"]{
  background:linear-gradient(130deg,var(--accent) 0%,#009ec0 100%);
  box-shadow:0 0 18px rgba(0,212,255,.22);
  color:#020a10;
}

/* ── Progress strip (inside deposit button) ────────────── */
.btn-deposit .phase-label{display:flex;align-items:center;gap:7px}
.phase-badge{
  font-size:.62rem;
  background:rgba(0,0,0,.25);
  border-radius:100px;
  padding:2px 7px;
  letter-spacing:.08em;
  white-space:nowrap;
}

/* ── Status area ───────────────────────────────────────── */
.status{margin-top:14px}
.spinner-row{
  display:flex;align-items:center;gap:11px;
  padding:12px 15px;
  background:var(--accent-dim);
  border:1px solid rgba(0,212,255,.2);
  border-radius:var(--r-sm);
  animation:fade-in .25s ease;
}
.spinner{
  width:17px;height:17px;flex-shrink:0;
  border:2px solid var(--border-hi);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-text{font-family:var(--mono);font-size:.75rem;color:var(--accent);letter-spacing:.04em}

.msg{
  padding:12px 15px;border-radius:var(--r-sm);
  font-family:var(--mono);font-size:.77rem;
  line-height:1.6;letter-spacing:.02em;
  animation:fade-in .3s ease;
}
.msg.ok {background:var(--green-dim);border:1px solid rgba(46,252,154,.35);color:var(--green)}
.msg.err{background:var(--red-dim);border:1px solid rgba(255,77,109,.35);color:var(--red)}
.msg.inf{background:var(--accent-dim);border:1px solid rgba(0,212,255,.25);color:var(--accent)}

.hidden{display:none!important}

/* ── Footer ────────────────────────────────────────────── */
footer{text-align:center}
.foot-note{
  font-family:var(--mono);font-size:.65rem;
  color:var(--text-3);letter-spacing:.05em;
}
.foot-note span{color:var(--accent)}

/* ── Responsive ────────────────────────────────────────── */
@media(max-width:480px){
  .card-inner{padding:20px 16px 18px}
  .sep{margin:16px -16px}
  .bal-num{font-size:1.2rem}
  .wrap{padding:18px 12px 28px}
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-grid"></div>
  <div class="bg-radial"></div>
</div>

<div class="wrap">

  <!-- ── Header ── -->
  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 8V16C4 22.627 9.373 28 16 30C22.627 28 28 22.627 28 16V8L16 2Z"
              stroke="var(--accent)" stroke-width="1.5"/>
        <path d="M11 16.5l3 3 7-7" stroke="var(--accent)" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">Secure<span>DeFi</span>Vault</span>
    </div>
    <div class="badge">
      <span class="badge-dot"></span>
      <span class="badge-label">Sepolia Testnet</span>
    </div>
  </header>

  <!-- ── Main card ── -->
  <main class="card">
    <div class="card-bar"></div>
    <div class="card-inner">

      <!-- Wallet -->
      <div class="mlabel">Wallet</div>
      <div class="wallet-box">
        <div id="walletChip" class="wallet-chip hidden">
          <span class="wallet-hex">⬡</span>
          <span id="walletAddr" class="wallet-addr">—</span>
          <button class="copy-btn" id="copyBtn" title="Copy full address">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
        <button class="btn-connect" id="connectBtn">
          <span id="connectLabel">Connect Wallet</span>
          <svg class="btn-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <div class="sep"></div>

      <!-- Balances -->
      <div class="mlabel">Balances</div>
      <div class="bal-grid">
        <div class="bal-tile">
          <div class="bal-title">Vault Deposit</div>
          <div class="bal-row">
            <span class="bal-num" id="vaultBal">—</span>
            <span class="bal-unit">TKN</span>
          </div>
        </div>
        <div class="bal-tile">
          <div class="bal-title">Wallet Tokens</div>
          <div class="bal-row">
            <span class="bal-num green" id="walletBal">—</span>
            <span class="bal-unit">TKN</span>
          </div>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>

      <div class="sep"></div>

      <!-- Transactions -->
      <div class="mlabel">Transaction</div>

      <!-- Amount input -->
      <div class="input-wrap">
        <input type="number" id="amountInput" class="amount-input"
               placeholder="0.00" step="0.001" min="0" disabled/>
        <span class="input-unit">TKN</span>
      </div>

      <!-- Smart Deposit button (approve + deposit combined) -->
      <div class="action-grid">
        <button class="btn btn-deposit" id="depositBtn" data-phase="approve" disabled>
          <span class="phase-label" id="depositLabel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span>Approve &amp; Deposit</span>
            <span class="phase-badge" id="phaseBadge">STEP 1/2</span>
          </span>
        </button>

        <button class="btn btn-withdraw" id="withdrawBtn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
          Withdraw
        </button>
      </div>

      <!-- Status -->
      <div class="status">
        <div class="spinner-row hidden" id="spinnerRow">
          <div class="spinner"></div>
          <span class="spin-text" id="spinText">Processing…</span>
        </div>
        <div class="msg hidden" id="msgBox"></div>
      </div>

    </div>
  </main>

  <footer>
    <p class="foot-note">
      Sepolia Testnet · Chain <span>11155111</span> · ethers.js v6
    </p>
  </footer>
</div>

<!-- ═══════════════════════════════════════════════════════
     APP LOGIC
═══════════════════════════════════════════════════════ -->
<script>
/* ── Config ─────────────────────────────────────────────── */
const TOKEN_ADDRESS = "0x603c652b72A44A334281467507e1d68b5285cD5b"; // ← paste your Sepolia ERC20 token address
const VAULT_ADDRESS = "0x22C4008D2787EB5A5afAeE1B9721f4ac72d9Dad7"; // ← paste your Sepolia vault address

const VAULT_ABI = [
  "function deposit(uint256 amount) public",
  "function withdraw(uint256 amount) public",
  "function balances(address) public view returns (uint256)"
];

const TOKEN_ABI = [
  "function approve(address spender, uint256 amount) public returns (bool)",
  "function allowance(address owner, address spender) public view returns (uint256)",
  "function balanceOf(address account) public view returns (uint256)"
];

/* ── State ──────────────────────────────────────────────── */
let provider    = null;
let signer      = null;
let vault       = null;
let token       = null;
let userAddress = null;
// "idle" | "needsApprove" | "readyDeposit"
let depositPhase = "idle";

/* ── DOM ────────────────────────────────────────────────── */
const connectBtn   = document.getElementById("connectBtn");
const connectLabel = document.getElementById("connectLabel");
const walletChip   = document.getElementById("walletChip");
const walletAddrEl = document.getElementById("walletAddr");
const copyBtn      = document.getElementById("copyBtn");
const vaultBalEl   = document.getElementById("vaultBal");
const walletBalEl  = document.getElementById("walletBal");
const refreshBtn   = document.getElementById("refreshBtn");
const amountInput  = document.getElementById("amountInput");
const depositBtn   = document.getElementById("depositBtn");
const depositLabel = document.getElementById("depositLabel");
const phaseBadge   = document.getElementById("phaseBadge");
const withdrawBtn  = document.getElementById("withdrawBtn");
const spinnerRow   = document.getElementById("spinnerRow");
const spinText     = document.getElementById("spinText");
const msgBox       = document.getElementById("msgBox");

/* ── UI helpers ─────────────────────────────────────────── */
const short = a => a.slice(0,6)+"…"+a.slice(-4);
const shortTx = h => h.slice(0,8)+"…"+h.slice(-6);
const fmt = raw => {
  const v = parseFloat(ethers.formatEther(raw));
  return v === 0 ? "0" : v.toFixed(6).replace(/\.?0+$/,"");
};

function spin(txt="Processing…"){
  spinText.textContent = txt;
  spinnerRow.classList.remove("hidden");
  msgBox.classList.add("hidden");
}
function stopSpin(){ spinnerRow.classList.add("hidden"); }

function msg(txt, type="inf"){
  stopSpin();
  msgBox.textContent = txt;
  msgBox.className = `msg ${type}`;
  msgBox.classList.remove("hidden");
}

function lock(yes){
  connectBtn.disabled = yes;
  depositBtn.disabled = yes;
  withdrawBtn.disabled = yes;
  refreshBtn.disabled = yes;
  amountInput.disabled = yes;
}

/* ── Deposit button visual phase ────────────────────────── */
function setPhase(phase){
  depositPhase = phase;
  if(phase === "needsApprove"){
    depositBtn.dataset.phase = "approve";
    depositBtn.disabled = false;
    depositLabel.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>
      </svg>
      <span>Approve &amp; Deposit</span>
      <span class="phase-badge">STEP 1 / 2</span>`;
  } else if(phase === "readyDeposit"){
    depositBtn.dataset.phase = "deposit";
    depositBtn.disabled = false;
    depositLabel.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="19 12 12 19 5 12"/>
      </svg>
      <span>Deposit Tokens</span>
      <span class="phase-badge" style="background:rgba(0,212,255,.25)">STEP 2 / 2</span>`;
  } else {
    depositBtn.dataset.phase = "approve";
    depositBtn.disabled = true;
    depositLabel.innerHTML = `
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/>
      </svg>
      <span>Approve &amp; Deposit</span>
      <span class="phase-badge">STEP 1 / 2</span>`;
  }
}

/* ── Fetch balances ──────────────────────────────────────── */
async function fetchBalances(){
  if(!vault||!token||!userAddress) return;
  try{
    const [vr,wr] = await Promise.all([
      vault.balances(userAddress),
      token.balanceOf(userAddress)
    ]);
    vaultBalEl.textContent  = fmt(vr);
    walletBalEl.textContent = fmt(wr);
  } catch(e){
    console.error("fetchBalances",e);
  }
}

/* ── Check current allowance → set phase ────────────────── */
async function syncPhase(amountWei){
  if(!token||!userAddress) return;
  try{
    const al = await token.allowance(userAddress, VAULT_ADDRESS);
    setPhase(al >= amountWei ? "readyDeposit" : "needsApprove");
  } catch(e){ setPhase("needsApprove"); }
}

/* ── Connect wallet ──────────────────────────────────────── */
async function connectWallet(){
  if(!window.ethereum){
    msg("MetaMask not found. Please install it to continue.","err"); return;
  }
  try{
    spin("Connecting wallet…");
    connectBtn.disabled = true;

    provider    = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts",[]);
    signer      = await provider.getSigner();
    userAddress = await signer.getAddress();

    const net = await provider.getNetwork();
    if(net.chainId !== 11155111n){
      msg(`Wrong network (chain ${net.chainId}). Switch MetaMask to Sepolia (11155111).`,"err");
      connectBtn.disabled = false; stopSpin(); return;
    }

    vault = new ethers.Contract(VAULT_ADDRESS, VAULT_ABI, signer);
    token = new ethers.Contract(TOKEN_ADDRESS, TOKEN_ABI, signer);

    walletAddrEl.textContent = short(userAddress);
    walletChip.classList.remove("hidden");
    connectLabel.textContent = "Connected";
    connectBtn.disabled = true;

    amountInput.disabled = false;
    withdrawBtn.disabled = false;
    refreshBtn.disabled  = false;
    setPhase("needsApprove"); // default — will sync when amount typed

    await fetchBalances();
    msg(`✓ Connected · ${short(userAddress)}`,"ok");
  } catch(e){
    console.error("connect",e);
    msg(e.code===4001 ? "Connection rejected." : `Failed: ${e.message}`,"err");
    connectBtn.disabled = false;
  }
}

/* ── Combined Approve → Deposit handler ─────────────────── */
async function handleDeposit(){
  if(!signer||!vault||!token){ msg("Connect your wallet first.","err"); return; }

  const raw = amountInput.value.trim();
  if(!raw||isNaN(raw)||parseFloat(raw)<=0){
    msg("Enter a valid token amount.","err"); return;
  }

  const amountWei = ethers.parseEther(raw);

  /* ── Phase 1: Approve ── */
  if(depositPhase === "needsApprove"){
    try{
      spin("Awaiting approval in MetaMask…");
      lock(true);

      // Check allowance one more time (might already be enough)
      const al = await token.allowance(userAddress, VAULT_ADDRESS);
      if(al >= amountWei){
        setPhase("readyDeposit");
        lock(false); depositBtn.disabled = false; withdrawBtn.disabled = false;
        msg(`Allowance already sufficient — click Deposit Tokens to proceed.`,"inf");
        return;
      }

      const tx = await token.approve(VAULT_ADDRESS, amountWei);
      spin(`Approval tx sent · ${shortTx(tx.hash)}`);
      await tx.wait();

      setPhase("readyDeposit");
      lock(false); depositBtn.disabled = false; withdrawBtn.disabled = false;
      msg(`✓ Approved ${raw} TKN — now click "Deposit Tokens".`,"ok");
    } catch(e){
      console.error("approve",e); handleErr(e,"Approval");
      lock(false); withdrawBtn.disabled = false;
      setPhase("needsApprove"); depositBtn.disabled = false;
    }
    return;
  }

  /* ── Phase 2: Deposit ── */
  if(depositPhase === "readyDeposit"){
    try{
      spin("Awaiting deposit in MetaMask…");
      lock(true);

      const tx = await vault.deposit(amountWei);
      spin(`Deposit tx sent · ${shortTx(tx.hash)}`);
      await tx.wait();

      amountInput.value = "";
      setPhase("needsApprove"); // reset flow for next use
      await fetchBalances();
      msg(`✓ Deposited ${raw} TKN successfully · tx ${shortTx(tx.hash)}`,"ok");
      lock(false); depositBtn.disabled = false; withdrawBtn.disabled = false;
    } catch(e){
      console.error("deposit",e); handleErr(e,"Deposit");
      lock(false); withdrawBtn.disabled = false;
      // Re-check if approval still valid
      await syncPhase(amountWei);
    }
  }
}

/* ── Withdraw ────────────────────────────────────────────── */
async function handleWithdraw(){
  if(!signer||!vault){ msg("Connect your wallet first.","err"); return; }

  const raw = amountInput.value.trim();
  if(!raw||isNaN(raw)||parseFloat(raw)<=0){
    msg("Enter a valid token amount.","err"); return;
  }

  try{
    spin("Awaiting withdrawal in MetaMask…");
    lock(true);

    const tx = await vault.withdraw(ethers.parseEther(raw));
    spin(`Withdrawal tx sent · ${shortTx(tx.hash)}`);
    await tx.wait();

    amountInput.value = "";
    await fetchBalances();
    msg(`✓ Withdrew ${raw} TKN successfully · tx ${shortTx(tx.hash)}`,"ok");
  } catch(e){
    console.error("withdraw",e); handleErr(e,"Withdrawal");
  } finally {
    lock(false);
    depositBtn.disabled = (depositPhase === "idle");
    withdrawBtn.disabled = false;
  }
}

/* ── Error formatter ─────────────────────────────────────── */
function handleErr(e, action){
  if(e.code===4001||e.code==="ACTION_REJECTED")
    msg(`${action} cancelled.`,"err");
  else if(e.reason)
    msg(`${action} failed: ${e.reason}`,"err");
  else{
    const m = (e.message||"Unknown error").slice(0,150);
    msg(`${action} failed: ${m}`,"err");
  }
}

/* ── Reset approval phase when amount changes ────────────── */
amountInput.addEventListener("input", async () => {
  if(!signer) return;
  const raw = amountInput.value.trim();
  if(!raw||isNaN(raw)||parseFloat(raw)<=0){ setPhase("needsApprove"); return; }
  await syncPhase(ethers.parseEther(raw));
});

/* ── Copy address ────────────────────────────────────────── */
copyBtn.addEventListener("click", async () => {
  if(!userAddress) return;
  try{
    await navigator.clipboard.writeText(userAddress);
    copyBtn.style.color = "var(--green)";
    setTimeout(()=>{ copyBtn.style.color = ""; }, 1600);
  } catch(_){}
});

/* ── MetaMask listeners ──────────────────────────────────── */
if(window.ethereum){
  window.ethereum.on("accountsChanged", ()=>location.reload());
  window.ethereum.on("chainChanged",    ()=>location.reload());
}

/* ── Wire ────────────────────────────────────────────────── */
connectBtn.addEventListener("click",  connectWallet);
depositBtn.addEventListener("click",  handleDeposit);
withdrawBtn.addEventListener("click", handleWithdraw);
refreshBtn.addEventListener("click",  fetchBalances);
</script>
</body>
</html>
